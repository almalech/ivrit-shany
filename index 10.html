const st={tab:saved.tab||'home',known:saved.known||{},volley:null,quiz:null,match:null,conj:null,role:null,fill:null,records:saved.records||{bestVolley:0,bestConj:0}};
function save(){try{localStorage.setItem(KEY,JSON.stringify({tab:st.tab,known:st.known,records:st.records}))}catch(e){}}
const $=id=>document.getElementById(id);
const mix=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const plain=s=>String(s).normalize('NFD').replace(/[\u0591-\u05C7]/g,'').replace(/[\u200e\u200f]/g,'').replace(/[.,!?؛׃]/g,'').replace(/\s+/g,' ').trim();
const escapeHTML=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tabs=[['home','Accueil'],['vocab','Verbes'],['volley','🏐 Volley'],['quiz','Traductions'],['match','Associations'],['conj','Je conjugue'],['role','Jeu de rôle'],['fill','Complète'],['progress','Progrès']];
function show(tab){st.tab=tab;save();render()}
function renderTabs(){let r=$('tabs');r.innerHTML='';tabs.forEach(([id,label])=>{let b=document.createElement('button');b.className=st.tab===id?'active':'';b.textContent=label;b.onclick=()=>show(id);r.appendChild(b)})}
function render(){renderTabs();let view=({home:home,vocab:vocab,volley:volley,quiz:quiz,match:match,conj:conj,role:role,fill:fill,progress:progress})[st.tab]||home;$('main').innerHTML=view()}
const verb=p=>WORDS[p%WORDS.length];
function home(){return `<section class="card"><div class="eyebrow">C'est parti !</div><div class="title">Bienvenue dans ton équipe 💙💛</div><p class="muted">Dans cette application, tu vas apprendre les verbes simples et surtout à les conjuguer au <b>passé</b> et au <b>futur</b>, avec des jeux et du volley.</p><span class="pill">${WORDS.length} verbes</span><span class="pill">Passé : אתמול</span><span class="pill">Futur : מחר</span></section><section class="card"><div class="title">🏐 Le terrain de Shany</div><img src="${IMAGES[0]}" style="display:block;width:100%;max-height:300px;object-fit:contain;border-radius:14px"><p class="muted">Bonne réponse : SMASH ! Mauvaise réponse : le ballon finit dans le filet.</p><button class="btn yellow" onclick="show('volley')">Jouer au volley</button></section><section class="card"><div class="title">Le truc à retenir</div><div class="he">אֶתְמוֹל לָמַדְתִּי</div><p>Hier, j'ai étudié.</p><div class="he">מָחָר אֶלְמַד</div><p>Demain, j'étudierai.</p><button class="btn light" onclick="show('conj')">M'entraîner à conjuguer</button></section>`}
function known(i){st.known[i]=!st.known[i];save();render()}
function vocab(){return `<section class="card"><div class="title">Les verbes de base</div><p class="muted">Infinitif, phonétique, passé et futur. Les formes sont à la première personne : <b>je</b> (אני). Tu peux cocher les verbes appris.</p></section>`+WORDS.map((w,i)=>`<section class="card"><div class="row"><div><div class="he">${w.he}</div><div class="phon">${w.ph}</div><strong>${escapeHTML(w.fr)}</strong></div><button class="btn light" onclick="known(${i})">${st.known[i]?'✓ Connu':'À apprendre'}</button></div><div class="columns" style="margin-top:13px"><div class="mini"><div class="eyebrow">Hier · אני</div><div class="hemini">${w.past}</div></div><div class="mini"><div class="eyebrow">Demain · אני</div><div class="hemini">${w.future}</div></div><div class="mini"><div class="eyebrow">Hier · elle</div><div class="hemini">${w.pastShe}</div></div><div class="mini"><div class="eyebrow">Demain · elle</div><div class="hemini">${w.futureShe}</div></div></div></section>`).join('')}
function newVolley(){st.volley={q:0,score:0,choices:[],order:mix(WORDS.map((_,i)=>i)).slice(0,10),answered:null,opponents:[Math.floor(Math.random()*4)+5,Math.floor(Math.random()*4)+4]}}
function volley(){if(!st.volley)newVolley();let s=st.volley;if(s.q>=10)return volleyEnd();let w=verb(s.order[s.q]);if(!s.choices.length)s.choices=mix([w.fr,...mix(WORDS.filter(x=>x.fr!==w.fr).map(x=>x.fr)).slice(0,3)]);let state=s.answered;let pic=state===null?0:state?1:2;return `<section class="card"><div class="eyebrow">Match de volley</div><div class="title">${state===null?'À toi de jouer !':state?'SMASH ! Point pour Shany 🏐':'Oups ! Dans le filet !'}</div><div class="stat"><div>Échange<strong>${s.q+1}/10</strong></div><div>Points<strong>${s.score}</strong></div><div>Record<strong>${st.records.bestVolley||0}</strong></div></div><div class="court"><img src="${IMAGES[pic]}" alt="Shany, volleyeuse en bleu et jaune"><div id="ball" class="ball ${state===null?'':state?'fly':'miss'}">🏐</div></div><div class="he" style="margin:15px 0">${w.he}</div><div class="muted">Que signifie ce verbe ?</div>${s.choices.map((c,i)=>`<button class="option" ${state!==null?'disabled':''} onclick="answerVolley(${i})">${escapeHTML(c)}</button>`).join('')}${state!==null?`<div class="message ${state?'good':'bad'}">${state?'Bravo !':`La bonne réponse était : ${escapeHTML(w.fr)}`}</div><button class="btn yellow" onclick="nextVolley()">${s.q===9?'Voir le podium':'Question suivante'}</button>`:''}</section>`}
function answerVolley(i){let s=st.volley;if(s.answered!==null)return;let good=s.choices[i]===verb(s.order[s.q]).fr;s.answered=good;if(good)s.score++;render()}
function nextVolley(){let s=st.volley;s.q++;s.answered=null;s.choices=[];render()}
function volleyEnd(){let s=st.volley;st.records.bestVolley=Math.max(st.records.bestVolley,s.score);save();let people=[{name:'Shany',score:s.score},{name:'Maya',score:s.opponents[0]},{name:'Noa',score:s.opponents[1]}].sort((a,b)=>b.score-a.score);let ranks=[['🥇','first'],['🥈','second'],['🥉','third']];return `<section class="card"><div class="eyebrow">Fin du match</div><div class="title">Le podium de volley 🏆</div><p class="muted">${s.score} bonnes réponses sur 10. Les adversaires ont des scores fixés pour cette partie.</p><div class="podium">${[1,0,2].map(i=>`<div class="place ${ranks[i][1]}">${ranks[i][0]}<br>${people[i].name}<br>${people[i].score} pts</div>`).join('')}</div><button class="btn yellow" onclick="newVolley();render()">Revanche !</button></section>`}
function newQuiz(){st.quiz={index:0,correct:0,seen:mix(WORDS.map((_,i)=>i)).slice(0,12),direction:Math.random()>.5,choices:[],result:null}}
function quiz(){if(!st.quiz)newQuiz();let s=st.quiz;if(s.index>=s.seen.length)return `<section class="card"><div class="title">Bravo ! ${s.correct}/12</div><button class="btn" onclick="newQuiz();render()">Rejouer</button></section>`;let w=verb(s.seen[s.index]);let heb=s.index%2===0;if(!s.choices.length){s.choices=heb?mix([w.fr,...mix(WORDS.filter(x=>x.fr!==w.fr).map(x=>x.fr)).slice(0,3)]):mix([w.he,...mix(WORDS.filter(x=>x.fr!==w.fr).map(x=>x.he)).slice(0,3)])}return `<section class="card"><div class="eyebrow">Traductions · ${s.index+1}/12</div><div class="title">${heb?'Hébreu → Français':'Français → Hébreu'}</div><div class="${heb?'he':'title'}" style="margin:20px 0">${heb?w.he:escapeHTML(w.fr)}</div>${s.choices.map((c,i)=>`<button class="option" ${s.result!==null?'disabled':''} onclick="answerQuiz(${i})">${c}</button>`).join('')}${s.result!==null?`<div class="message ${s.result?'good':'bad'}">${s.result?'Correct !':'Bonne réponse : '+(heb?w.fr:w.he)}</div><button class="btn yellow" onclick="st.quiz.index++;st.quiz.choices=[];st.quiz.result=null;render()">Continuer</button>`:''}</section>`}
function answerQuiz(i){let s=st.quiz;if(s.result!==null)return;let w=verb(s.seen[s.index]);s.result=s.choices[i]===(s.index%2===0?w.fr:w.he);if(s.result)s.correct++;render()}
function newMatch(){let ids=mix(WORDS.map((_,i)=>i)).slice(0,5);st.match={ids,heOrder:mix(ids),frOrder:mix(ids),first:null,done:[],notice:''}}
function match(){if(!st.match)newMatch();let s=st.match;return `<section class="card"><div class="eyebrow">Associations</div><div class="title">Relie les 5 paires</div><p class="muted">Appuie sur un mot en hébreu, puis sur sa traduction.</p><div class="matchgrid"><div class="matchcol">${s.heOrder.map(i=>`<button class="matchbtn ${s.first===i?'selected':''} ${s.done.includes(i)?'done':''}" ${s.done.includes(i)?'disabled':''} onclick="firstMatch(${i})">${WORDS[i].he}</button>`).join('')}</div><div class="matchcol">${s.frOrder.map(i=>`<button class="matchbtn ${s.done.includes(i)?'done':''}" ${s.done.includes(i)?'disabled':''} onclick="secondMatch(${i})">${escapeHTML(WORDS[i].fr)}</button>`).join('')}</div></div><div class="message ${s.notice.includes('Bravo')?'good':'hint'}">${s.notice||s.done.length+' / 5 paires trouvées'}</div><button class="btn yellow" onclick="newMatch();render()">Nouvelle série</button></section>`}
function firstMatch(i){st.match.first=i;st.match.notice='';render()}
function secondMatch(i){let s=st.match;if(s.first===null){s.notice='Choisis d’abord un mot en hébreu.'}else if(s.first===i){s.done.push(i);s.first=null;s.notice=s.done.length===5?'Bravo, 5 sur 5 !':'Bravo ! Bonne association.'}else{s.first=null;s.notice='Ce n’est pas la bonne paire. Réessaie.'}render()}
function newConj(){st.conj={index:0,score:0,seen:mix(WORDS.map((_,i)=>i)).slice(0,12),choices:[],answered:null}}
function conj(){if(!st.conj)newConj();let s=st.conj;if(s.index>=12){st.records.bestConj=Math.max(st.records.bestConj,s.score);save();return `<section class="card"><div class="title">Je conjugue : ${s.score}/12</div><button class="btn" onclick="newConj();render()">Rejouer</button></section>`}let w=verb(s.seen[s.index]);let future=s.index%2===1;let person=s.index%4>=2?'she':'I';let answer=person==='I'?(future?w.future:w.past):(future?w.futureShe:w.pastShe);let options=[w.he,w.past,w.future,w.pastShe,w.futureShe].filter(x=>x!==answer);if(!s.choices.length)s.choices=mix([answer,...mix([...new Set(options)]).slice(0,3)]);return `<section class="card"><div class="eyebrow">Je conjugue · ${s.index+1}/12</div><div class="title">${future?'Futur · מחר':'Passé · אתמול'} · ${person==='I'?'Je (אני)':'Elle (היא)'}</div><p>Verbe : <strong>${escapeHTML(w.fr)}</strong></p><div class="he">${future?'מחר':'אתמול'} ${person==='I'?'אני':'היא'} ___</div><div class="muted">Choisis la bonne conjugaison (pas l’infinitif !)</div>${s.choices.map((c,i)=>`<button class="option" ${s.answered!==null?'disabled':''} onclick="answerConj(${i})"><span dir="rtl">${c}</span></button>`).join('')}${s.answered!==null?`<div class="message ${s.answered?'good':'bad'}">${s.answered?'Bravo !':'La forme correcte est : '+answer}<br><small>Infinitif : ${w.he} · ${future?'Futur':'Passé'} : ${answer}</small></div><button class="btn yellow" onclick="st.conj.index++;st.conj.answered=null;st.conj.choices=[];render()">Continuer</button>`:''}</section>`}
function answerConj(i){let s=st.conj;if(s.answered!==null)return;let w=verb(s.seen[s.index]),future=s.index%2===1,person=s.index%4>=2?'she':'I',answer=person==='I'?(future?w.future:w.past):(future?w.futureShe:w.pastShe);s.answered=s.choices[i]===answer;if(s.answered)s.score++;render()}
function newRole(){st.role={scenario:0,step:0,score:0,feedback:''}}
function role(){if(!st.role)newRole();let s=st.role,sc=SCENARIOS[s.scenario];if(s.step>=sc.steps.length)return `<section class="card"><div class="title">Mission terminée !</div><p>${s.score} bonnes réponses sur ${sc.steps.length}.</p><button class="btn" onclick="st.role={scenario:(s.scenario+1)%SCENARIOS.length,step:0,score:0,feedback:''};render()">Mission suivante</button></section>`;let [fr,he]=sc.steps[s.step];return `<section class="card"><div class="eyebrow">Jeu de rôle écrit · ${s.step+1}/${sc.steps.length}</div><div class="title">${sc.name}</div><p class="muted">Écris la phrase en hébreu. Pas besoin de mettre les nékoudot.</p><div class="mini"><strong>${escapeHTML(fr)}</strong></div><label for="writing">Ta phrase en hébreu</label><textarea id="writing" dir="rtl" lang="he" placeholder="אני ..."></textarea><div id="roleFeedback" class="message ${s.feedback?'hint':''}">${s.feedback||''}</div><div class="row"><button class="btn" onclick="checkRole()">Vérifier</button><button class="btn light" onclick="roleHint()">💡 Indice</button><button class="btn yellow" onclick="s.step++;s.feedback='';render()">Passer</button></div></section>`}
function checkRole(){let s=st.role,correct=SCENARIOS[s.scenario].steps[s.step][1];let value=plain($('writing').value);if(!value)return;if(value===plain(correct)){s.score++;s.step++;s.feedback='';render()}else{$('roleFeedback').textContent='À revoir. Exemple de réponse : '+correct;$('roleFeedback').className='message bad'}}
function roleHint(){let s=st.role;let answer=SCENARIOS[s.scenario].steps[s.step][1];$('roleFeedback').textContent='Premier mot : '+answer.split(' ')[0];$('roleFeedback').className='message hint'}
function newFill(){st.fill={index:0,score:0,order:mix(FILLS.map((_,i)=>i)),feedback:''}}
function fill(){if(!st.fill)newFill();let s=st.fill;if(s.index>=s.order.length)return `<section class="card"><div class="title">Complète : ${s.score}/${s.order.length}</div><button class="btn" onclick="newFill();render()">Rejouer</button></section>`;let f=FILLS[s.order[s.index]];return `<section class="card"><div class="eyebrow">Complète la phrase · ${s.index+1}/${s.order.length}</div><div class="title">Passé ou futur ?</div><div class="he">${f.he}</div><p class="muted">${f.fr}</p><label for="fillInput">Le verbe manquant</label><input id="fillInput" dir="rtl" lang="he" placeholder="Écris le verbe"><div id="fillFeedback" class="message hint">Nékoudot facultatifs.</div><button class="btn" onclick="checkFill()">Vérifier</button> <button class="btn light" onclick="fillHint()">💡 Indice</button> <button class="btn yellow" onclick="st.fill.index++;render()">Passer</button></section>`}
function checkFill(){let s=st.fill,f=FILLS[s.order[s.index]],v=plain($('fillInput').value);if(!v)return;if(v===plain(f.answer)){s.score++;s.index++;render()}else{$('fillFeedback').textContent='Pas encore. Bonne réponse : '+f.answer;$('fillFeedback').className='message bad'}}
function fillHint(){let f=FILLS[st.fill.order[st.fill.index]];$('fillFeedback').textContent='Le mot commence par : '+f.answer[0];$('fillFeedback').className='message hint'}
function progress(){return `<section class="card"><div class="title">Ta progression 💙💛</div><div class="stat"><div>Verbes connus<strong>${Object.values(st.known).filter(Boolean).length}/${WORDS.length}</strong></div><div>Volley<strong>${st.records.bestVolley||0}/10</strong></div><div>Conjugaison<strong>${st.records.bestConj||0}/12</strong></div></div><p class="muted">Tes records et les verbes connus sont enregistrés sur ton appareil.</p><button class="btn light" onclick="if(confirm('Effacer la progression de Shany ?')){localStorage.removeItem(KEY);location.reload()}">Réinitialiser</button></section>`}
render();
</script></body></html>
