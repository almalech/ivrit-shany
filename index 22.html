const KEY='ivrit-shany-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){};
const st={tab:saved.tab||'home',known:saved.known||{},volley:null,quiz:null,match:null,conj:null,role:null,fill:null,records:saved.records||{bestVolley:0,bestConj:0}};
function save(){try{localStorage.setItem(KEY,JSON.stringify({tab:st.tab,known:st.known,records:st.records}))}catch(e){}}
const $=id=>document.getElementById(id);
const mix=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const plain=s=>String(s).normalize('NFD').replace(/[\u0591-\u05C7]/g,'').replace(/[\u200e\u200f]/g,'').replace(/[.,!?؛׃]/g,'').replace(/\s+/g,' ').trim();
const escapeHTML=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const tabs=[['home','Accueil'],['vocab','Verbes'],['volley','🏐 Volley'],['quiz','Traductions'],['match','Associations'],['conj','Je conjugue'],['role','Jeu de rôle'],['fill','Complète'],['progress','Progrès']];
function show(tab){st.tab=tab;save();render()}
function renderTabs(){let r=$('tabs');r.innerHTML='';tabs.forEach(([id,label])=>{let b=document.createElement('button');b.className=st.tab===id?'active':'';b.textContent=label;b.onclick=()=>show(id);r.appendChild(b)})}
function render(){renderTabs();let view=({home:home,vocab:vocab,volley:volley,quiz:quiz,match:match,conj:conj,role:role,fill:fill,progress:progress})[st.tab]||home;$('main').innerHTML=view()}
const verb=p=>WORDS[p%WORDS.length];
function home(){return `<section class="card"><div class="eyebrow">C'est parti !</div><div class="title">Bienvenue dans ton équipe 💙💛</div><p class="muted">Dans cette application, tu vas apprendre les verbes simples et surtout à les conjuguer au <b>passé</b> et au <b>futur</b>, avec des jeux et du volley.</p><span class="pill">${WORDS.length} verbes</span><span class="pill">Passé : אתמול</span><span class="pill">Futur : מחר</span></section><section class="card"><div class="title">🏐 Le terrain de Shany</div><img src="${IMAGES[0]}" style="display:block;width:100%;max-height:300px;object-fit:contain;border-radius:14px"><p class="muted">Bonne réponse : SMASH ! Mauvaise réponse : le ballon finit dans le filet.</p><button class="btn yellow" onclick="show('volley')">Jouer au volley</button></section><section class="card"><div class="title">Le truc à retenir</div><div class="he">אֶתְמוֹל לָמַדְתִּי</div><p>Hier, j'ai étudié.</p><div class="he">מָחָר אֶלְמַד</div><p>Demain, j'étudierai.</p><button class="btn light" onclick="show('conj')">M'entraîner à conjuguer</button></section>`}
function known(i){st.known[i]=!st.known[i];save();render()}
function vocab(){return `<section class="card"><div class="title">Les verbes de base</div><p class="muted">Infinitif, phonétique, passé et futur. Les formes sont à la première personne : <b>je</b> (אני). Tu peux cocher les verbes appris.</p></section>`+WORDS.map((w,i)=>`<section class="card"><div class="row"><div><div class="he">${w.he}</div><div class="phon">${w.ph}</div><strong>${escapeHTML(w.fr)}</strong></div><button class="btn light" onclick="known(${i})">${st.known[i]?'✓ Connu':'À apprendre'}</button></div><div class="columns" style="margin-top:13px"><div class="mini"><div class="eyebrow">Hier · אני</div><div class="hemini">${w.past}</div></div><div class="mini"><div class="eyebrow">Demain · אני</div><div class="hemini">${w.future}</div></div><div class="mini"><div class="eyebrow">Hier · elle</div><div class="hemini">${w.pastShe}</div></div><div class="mini"><div class="eyebrow">Demain · elle</div><div class="hemini">${w.futureShe}</div></div></div></section>`).join('')}
function newVolley(){st.volley={q:0,score:0,choices:[],order:mix(WORDS.map((_,i)=>i)).slice(0,10),answered:null,opponents:[Math.floor(Math.random()*4)+5,Math.floor(Math.random()*4)+4]}}
function volley(){if(!st.volley)newVolley();let s=st.volley;if(s.q>=10)return volleyEnd();let w=verb(s.order[s.q]);if(!s.choices.length)s.choices=mix([w.fr,...mix(WORDS.filter(x=>x.fr!==w.fr).map(x=>x.fr)).slice(0,3)]);let state=s.answered;let pic=state===null?0:state?1:2;return `<section class="card"><div class="eyebrow">Match de volley</div><div class="title">${state===null?'À toi de jouer !':state?'SMASH ! Point pour Shany 🏐':'Oups ! Dans le filet !'}</div><div class="stat"><div>Échange<strong>${s.q+1}/10</strong></div><div>Points<strong>${s.score}</strong></div><div>Record<strong>${st.records.bestVolley||0}</strong></div></div><div class="court"><img src="${IMAGES[pic]}" alt="Shany, volleyeuse en bleu et jaune"><div id="ball" class="ball ${state===null?'':state?'fly':'miss'}">🏐</div></div><div class="he" style="margin:15px 0">${w.he}</div><div class="muted">Que signifie ce verbe ?</div>${s.choices.map((c,i)=>`<button class="option" ${state!==null?'disabled':''} onclick="answerVolley(${i})">${escapeHTML(c)}</button>`).join('')}${state!==null?`<div class="message ${state?'good':'bad'}">${state?'Bravo !':`La bonne réponse était : ${escapeHTML(w.fr)}`}</div><button class="btn yellow" onclick="nextVolley()">${s.q===9?'Voir le podium':'Question suivante'}</button>`:''}</section>`}
function answerVolley(i){let s=st.volley;if(s.answered!==null)return;let good=s.choices[i]===verb(s.order[s.q]).fr;s.answered=good;if(good)s.score++;render()}
function nextVolley(){let s=st.volley;s.q++;s.answered=null;s.choices=[];render()}
function volleyEnd(){let s=st.volley;st.records.bestVolley=Math.max(st.records.bestVolley,s.score);save();let people=[{name:'Shany',score:s.score},{name:'Maya',score:s.opponents[0]},{name:'Noa',score:s.opponents[1]}].sort((a,b)=>b.score-a.score);let ranks=[['🥇','first'],['🥈','second'],['🥉','third']];return `<section class="card"><div class="eyebrow">Fin du match</div><div class="title">Le podium de volley 🏆</div><p class="muted">${s.score} bonnes réponses sur 10. Les adversaires ont des scores fixés pour cette partie.</p><div class="podium">${[1,0,2].map(i=>`<div class="place ${ranks[i][1]}">${ranks[i][0]}<br>${people[i].name}<br>${people[i].score} pts</div>`).join('')}</div><button class="btn yellow" onclick="newVolley();render()">Revanche !</button></section>`}
function newQuiz(){st.quiz={index:0,correct:0,seen:mix(WORDS.map((_,i)=>i)).slice(0,12),direction:Math.random()>.5,choices:[],result:null}}
function quiz(){if(!st.quiz)newQuiz();let s=st.quiz;if(s.index>=s.seen.length)return `<section class="card"><div class="title">Bravo ! ${s.correct}/12</div><button class="btn" onclick="newQuiz();render()">Rejouer</button></section>`;let w=verb(s.seen[s.index]);let heb=s.index%2===0;if(!s.choices.length){s.choices=heb?mix([w.fr,...mix(WORDS.filter(x=>x.fr!==w.fr).map(x=>x.fr)).slice(0,3)]):mix([w.he,...mix(WORDS.filter(x=>x.fr!==w.fr).map(x=>x.he)).slice(0,3)])}return `<section class="card"><div class="eyebrow">Traductions · ${s.index+1}/12</div><div class="title">${heb?'Hébreu → Français':'Français → Hébreu'}</div><div class="${heb?'he':'title'}" style="margin:20px 0">${heb?w.he:escapeHTML(w.fr)}</div>${s.choices.map((c,i)=>`<button class="option" ${s.result!==null?'disabled':''} onclick="answerQuiz(${i})">${c}</button>`).join('')}${s.result!==null?`<div class="message ${s.result?'good':'bad'}">${s.result?'Correct !':'Bonne réponse : '+(heb?w.fr:w.he)}</div><button class="btn yellow" onclick="st.quiz.index++;st.quiz.choices=[];st.quiz.result=null;render()">Continuer</button>`:''}</section>`}
function answerQuiz(i){let s=st.quiz;if(s.result!==null)return;let w=verb(s.seen[s.index]);s.result=s.choices[i]===(s.index%2===0?w.fr:w.he);if(s.result)s.correct++;render()}
function newMatch(){let ids=mix(WORDS.map((_,i)=>i)).slice(0,5);st.match={ids,heOrder:mix(ids),frOrder:mix(ids),first:null,done:[],notice:''}}

// Aventure Volley – version 2. Les options restent fixes pendant chaque question.
const ADV_TYPES=['Traduction','Paires','Conjugaison','Rapidité','Écriture','Memory','Compléter','Traduction','Rapidité','Paires','Écriture','Conjugaison','Memory','Compléter','Rapidité','Paires','Écriture','Conjugaison','Memory','Finale'];
const ADV_KEY='ivrit-shany-adventure-v2'; // V3 conserve la progression de V2
let advSaved={};try{advSaved=JSON.parse(localStorage.getItem(ADV_KEY)||'{}')||{}}catch(e){}
let advUnlocked=Math.max(1,Math.min(20,Number(advSaved.unlocked)||1));
let advStars=advSaved.stars||{};
let advRun=null;
let advTimer=null;
function advPersist(){try{localStorage.setItem(ADV_KEY,JSON.stringify({unlocked:advUnlocked,stars:advStars}))}catch(e){}}
function advClean(s){return plain(String(s)).replace(/[\u05F3\u05F4']/g,'').trim()}
const advRandom=mix;
const advLevelType=n=>ADV_TYPES[n-1];
const advLevelItems=n=>n<=5?4:n<=10?5:n<=15?6:7;
const advGetVerb=idx=>WORDS[idx%WORDS.length];
const advForm=(w,tense,person)=>person==='she'?(tense==='past'?w.pastShe:w.futureShe):(tense==='past'?w.past:w.future);
function advBuildQuestions(level){
  const count=advLevelItems(level),pool=Math.min(WORDS.length,Math.max(8,6+level*2));
  const ids=advRandom(Array.from({length:pool},(_,i)=>i)).slice(0,count);
  return ids.map((ix,step)=>{
    const w=advGetVerb(ix),tense=(step+level)%2===0?'past':'future',person=(level>7&&step%3===0)?'she':'I';
    const answer=advForm(w,tense,person);
    const impostors=advRandom(WORDS.slice(0,pool).filter(x=>x!==w).map(x=>advForm(x,tense,person)).filter(x=>advClean(x)!==advClean(answer)));
    const options=advRandom([answer,...impostors.slice(0,3)]);
    const mode=(level===20)?['Traduction','Conjugaison','Écriture','Rapidité','Compléter','Traduction','Conjugaison'][step]:(advLevelType(level));
    if(mode==='Traduction'){
      const toHeb=(step+level)%2===0;
      const correct=toHeb?answer:w.fr;
      const distract=toHeb?impostors:advRandom(WORDS.slice(0,pool).filter(x=>x!==w).map(x=>x.fr));
      return {mode,w,tense,person,correct,options:advRandom([correct,...distract.slice(0,3)]),prompt:toHeb?`${tense==='past'?'Hier':'Demain'}, ${person==='I'?'je':'elle'} : ${w.fr}`:answer,subtitle:toHeb?'Choisis la bonne forme en hébreu':'Que signifie cette forme ?'};
    }
    return {mode,w,tense,person,correct:answer,options,prompt:`${tense==='past'?'Hier · אתמול':'Demain · מחר'} · ${person==='I'?'Je (אני)':'Elle (היא)'} · ${w.fr}`,subtitle:'Quelle est la bonne forme conjuguée ?'};
  });
}
function advStart(level){
 if(level>advUnlocked)return;
 clearInterval(advTimer);advTimer=null;
 const type=advLevelType(level),items=advBuildQuestions(level);
 advRun={level,type,items,index:0,correct:0,attempts:0,answered:null,ended:false,matched:[],selected:null,flipped:[],busy:false,pairs:null,seconds:Math.max(22,51-level),startAt:Date.now()};
 if(['Paires','Memory'].includes(type)){advSetPairs()}
 st.tab='adventure';save();render();advStartClock();
}
function advSetPairs(){
 const r=advRun;const n=Math.min(5,Math.max(3,3+Math.floor(r.level/7))),pool=Math.min(WORDS.length,6+r.level*2);
 const selected=advRandom(Array.from({length:pool},(_,i)=>i)).slice(0,n);
 if(r.type==='Paires')r.pairs={selected,left:advRandom(selected),right:advRandom(selected)};
 else{let cards=[];selected.forEach(i=>{cards.push({id:i,side:'he',text:WORDS[i].he});cards.push({id:i,side:'fr',text:WORDS[i].fr})});r.pairs={selected,cards:advRandom(cards)};}
}
function advStartClock(){
 if(!advRun||!['Rapidité'].includes(advRun.type)&&advRun.level!==20)return;
 clearInterval(advTimer);
 advTimer=setInterval(()=>{
  if(!advRun||advRun.ended){clearInterval(advTimer);return;}
  const remain=Math.max(0,advRun.seconds-Math.floor((Date.now()-advRun.startAt)/1000));
  const el=document.getElementById('adv-clock');if(el)el.textContent=remain+' s';
  if(remain<=0)advFinish();
 },250)
}
function advStop(){clearInterval(advTimer);advTimer=null;advRun=null;render()}
function advQuestion(){return advRun.items[advRun.index]}
function advCheck(value){const r=advRun;if(!r||r.ended||r.answered!==null)return;
 const q=advQuestion();if(!q)return;
 const ok=advClean(value)===advClean(q.correct);
 r.attempts++;if(ok)r.correct++;
 r.answered={ok,correct:q.correct};render();
}
function advSubmitText(){const el=document.getElementById('adv-input');if(el&&el.value.trim())advCheck(el.value)}
function advNext(){const r=advRun;if(!r||r.ended)return;r.index++;r.answered=null;if(r.index>=r.items.length)advFinish();else render()}
function advChooseLeft(i){let r=advRun;if(!r||r.ended||r.matched.includes(i))return;r.selected=i;render()}
function advChooseRight(i){let r=advRun;if(!r||r.ended||r.matched.includes(i))return;
 if(r.selected===null)return;
 r.attempts++;
 if(r.selected===i){r.correct++;r.matched.push(i)}
 r.selected=null;
 if(r.matched.length>=r.pairs.selected.length)advFinish();else render();
}
function advFlip(i){const r=advRun;if(!r||r.ended||r.busy||r.matched.includes(r.pairs.cards[i].id)||r.flipped.includes(i))return;
 r.flipped.push(i);render();
 if(r.flipped.length===2){r.attempts++;let a=r.pairs.cards[r.flipped[0]],b=r.pairs.cards[r.flipped[1]];
  if(a.id===b.id){r.correct++;r.matched.push(a.id);r.flipped=[];if(r.matched.length===r.pairs.selected.length)advFinish();else render();}
  else{r.busy=true;setTimeout(()=>{if(advRun===r){r.flipped=[];r.busy=false;render()}},850)}
 }
}
function advFinish(){const r=advRun;if(!r||r.ended)return;r.ended=true;clearInterval(advTimer);advTimer=null;
 const total=r.type==='Paires'||r.type==='Memory'?r.pairs.selected.length:r.items.length;
 const score=r.correct/total;
 const goal=r.type==='Memory'||r.type==='Paires'?r.matched.length===total:score>=.7;
 const stars=goal?(score>=.99?3:score>=.85?2:1):0;
 if(goal){advStars[r.level]=Math.max(advStars[r.level]||0,stars);advUnlocked=Math.max(advUnlocked,Math.min(20,r.level+1));advPersist()}
 r.won=goal;r.earned=stars;render();
}

 function setup(){
  overlay=document.createElement('section');overlay.id='pf-screen';if(CFG.shany)overlay.classList.add('shany');
  overlay.innerHTML=`<div class="pf-shell"><div class="pf-top"><div><h2 class="pf-title">${CFG.shany?'🏐 Défi des paires':'🌸 Pluie de mots'}</h2><span class="pf-sub">Hébreu × français · une paire toutes les 5 secondes</span></div><button class="pf-x" id="pf-close">✕ Fermer</button></div><div class="pf-banner"><div class="pf-stats"><span id="pf-stats">0 paire · 0 point</span><span>⏱️ +2 tuiles / 5 s</span></div><div class="pf-timer"><div id="pf-timer" style="width:100%"></div></div></div><div id="pf-play"><div class="pf-arena"><div class="pf-ceiling"></div><div class="pf-grid" id="pf-grid"></div></div><div class="pf-message" id="pf-message" aria-live="polite"></div><div class="pf-help">Touche un mot en hébreu puis sa traduction (ou l'inverse). Pas de couleur pour t'aider !</div></div><div id="pf-result" hidden></div><div style="text-align:center;margin-top:12px"><button class="pf-btn" id="pf-reset">↻ Nouvelle partie</button></div></div>`;
  document.body.appendChild(overlay);
  const scene=overlay.querySelector('.pf-arena');
  try {
    let bg=null;
    if(!CFG.shany&&typeof ADV_BG!=='undefined')bg='url('+ADV_BG+')';
    if(CFG.shany){let sample=document.createElement('div');sample.className='shany-map';sample.style.cssText='position:absolute;left:-9999px;top:0;width:100px;height:100px';document.body.appendChild(sample);const computed=getComputedStyle(sample).backgroundImage;sample.remove();if(computed&&computed!=='none')bg=computed;}
    if(bg)scene.style.backgroundImage='linear-gradient(180deg,rgba(255,248,253,.77),rgba(255,246,252,.76)),'+bg;
  }catch(e){}
  grid=overlay.querySelector('#pf-grid');timerFill=overlay.querySelector('#pf-timer');message=overlay.querySelector('#pf-message');stats=overlay.querySelector('#pf-stats');
  overlay.querySelector('#pf-close').onclick=close;overlay.querySelector('#pf-reset').onclick=seed;
 }
 function addNav(){
  let nav=document.querySelector('#tabs');if(!nav||nav.querySelector('[data-pairfall]'))return;
  let b=document.createElement('button');b.type='button';b.className='pf-launch'+(CFG.shany?' shany':'');b.textContent=CFG.shany?'🏐 Tetris des mots':'🌸 Tetris des mots';b.dataset.pairfall='1';b.onclick=e=>{e.stopPropagation();open()};nav.appendChild(b);
 }
 // Allow dynamic navbar re-renders (Shany), without touching the existing games.
 function init(){addNav();const nav=document.querySelector('#tabs');if(nav){new MutationObserver(()=>{if(!nav.querySelector('[data-pairfall]'))addNav()}).observe(nav,{childList:true})}}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
 window.Pairfall={open,close};
})();
</script></body></html>
